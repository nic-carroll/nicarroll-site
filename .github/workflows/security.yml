name: Security scan
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan full history for credentials
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Static analysis
        run: |
          pipx install semgrep
          semgrep scan --config p/security-audit --config p/javascript --config p/nginx --config p/dockerfile --severity ERROR --error --metrics off
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the live site sends its security headers
        run: |
          URL=https://nicarroll-site-qjsgyud2vq-ue.a.run.app/
          HEADERS=$(curl -sSI "$URL")
          for h in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy; do
            echo "$HEADERS" | grep -qi "^$h:" && echo "ok $h" || { echo "MISSING $h"; exit 1; }
          done
          curl -sSf "${URL}.well-known/security.txt" > /dev/null
