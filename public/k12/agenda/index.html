<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Agenda Board · Nic Carroll</title>
<meta name="description" content="Class Agenda Board: a working example tool from the Gemini Tool Builder Playbook for K12 by Nic Carroll. All names and records are invented sample data.">
<meta property="og:title" content="Class Agenda Board">
<meta property="og:image" content="https://niccarroll.org/assets/showcase/k12-agenda.jpg">
<link rel="icon" href="../../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts.css?v=20261125">
<script src="/sitebar.js" defer></script>
<link rel="stylesheet" href="css/base.css">
<style>
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{display:grid;gap:2px;text-align:left;min-width:132px;padding:10px 16px;border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-m);background:var(--md-surface-container-lowest);color:var(--md-on-surface)}
.ptab b{font:500 .9375rem/1.25rem var(--md-font)}
.ptab span{font:400 .75rem/1rem var(--md-font);color:var(--md-on-surface-variant)}
.ptab[aria-pressed="true"]{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary)}
.ptab[aria-pressed="true"] span{color:var(--md-on-primary);opacity:.85}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar h2{min-width:0;overflow-wrap:anywhere}
.target{background:var(--md-primary-container);color:var(--md-on-primary-container);border-radius:var(--md-shape-l);padding:20px;display:grid;gap:6px}
.target .lab,.blk .lab{font:500 .75rem/1rem var(--md-font);letter-spacing:.08em;text-transform:uppercase}
.target p{font:400 1.5rem/2rem var(--md-font);letter-spacing:0;overflow-wrap:anywhere}
.blk{display:grid;gap:6px}
.blk .lab{color:var(--md-primary)}
.blk p{font:400 1.125rem/1.625rem var(--md-font);white-space:pre-wrap;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:grid}
.steps li label{display:flex;gap:12px;align-items:center;min-height:48px;padding:4px 0;border-bottom:1px solid var(--md-outline-variant);font:400 1.0625rem/1.5rem var(--md-font);overflow-wrap:anywhere}
.steps li:last-child label{border-bottom:0}
.steps input{width:20px;height:20px;accent-color:var(--md-primary);flex:none}
.steps li.done label{color:var(--md-on-surface-variant);text-decoration:line-through}
.hw{background:var(--md-caution-container);color:var(--md-on-caution-container);border-radius:var(--md-shape-m);padding:16px;display:grid;gap:4px;overflow-wrap:anywhere}
.two>*{min-width:0}
body.student .teach-only{display:none !important}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="btn text" href="../../k12-playbook.html"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Playbook</a>
  <span class="lead"><span class="material-symbols-outlined" aria-hidden="true">today</span></span>
  <div><h1>Class Agenda Board</h1><div class="sub">High school math, five periods, sample content</div></div>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="View" id="mode"></div>
  <button class="btn outlined sm teach-only" id="reset" type="button">Restore sample</button>
</div></header>
<main class="wrap" id="app"></main>
<script src="js/kit.js"></script>
<script>
(function(){
"use strict";
var KEY="demo-agenda-v1",$=function(id){return document.getElementById(id)},esc=K.esc;
function sym(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function shift(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return iso(d)}
var TODAY=iso(new Date());
var DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function nice(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return DN[d.getDay()]+", "+MN[d.getMonth()]+" "+d.getDate()}
function short(s){var p=s.split("-");return MN[+p[1]-1].slice(0,3)+" "+(+p[2])}
function sample(){
  var P=[["1st Period","Algebra"],["2nd Period","Algebra"],["3rd Period","Geometry"],["5th Period","Geometry"],["6th Period","Algebra"]].map(function(x,i){return {id:"p"+i,name:x[0],course:x[1]}});
  var alg={target:"I can solve a system of two linear equations by substitution.",donow:"Solve for y:  3x + y = 10\nThen find y when x = 2.",steps:"Do Now and homework check, 8 minutes\nMini lesson: solving by substitution, 15 minutes\nPartner practice, problems 1 to 8, 15 minutes\nExit ticket, 5 minutes",hw:"Practice set 4.2, odd problems only",due:shift(TODAY,1)};
  var alg2={target:"I can decide whether substitution or elimination is the better method for a system.",donow:"Solve by substitution:  y = 2x  and  x + y = 12",steps:"Do Now, 5 minutes\nReview exit tickets from yesterday, 10 minutes\nMini lesson: elimination, 15 minutes\nStations practice, 15 minutes",hw:"Practice set 4.3, problems 1 to 10",due:shift(TODAY,2)};
  var geo={target:"I can use the Pythagorean theorem to find a missing side of a right triangle.",donow:"Find the square root of 144 and of 225.\nWhich is larger, 13 squared or 12 squared plus 5 squared?",steps:"Do Now, 5 minutes\nDiscovery task with grid paper, 15 minutes\nNotes: the Pythagorean theorem, 10 minutes\nPractice problems 1 to 10, 15 minutes",hw:"Finish practice problems 1 to 10",due:shift(TODAY,1)};
  var days=[];
  P.forEach(function(p){var a=p.course==="Algebra"?alg:geo;days.push({id:K.uid(),period:p.id,date:TODAY,target:a.target,donow:a.donow,steps:a.steps,done:[],hw:a.hw,due:a.due})});
  days.push({id:K.uid(),period:"p0",date:shift(TODAY,1),target:alg2.target,donow:alg2.donow,steps:alg2.steps,done:[],hw:alg2.hw,due:alg2.due});
  var up=[];
  P.forEach(function(p){if(p.course==="Algebra"){up.push({id:K.uid(),period:p.id,date:shift(TODAY,3),title:"Quiz: solving systems",kind:"Quiz"});up.push({id:K.uid(),period:p.id,date:shift(TODAY,8),title:"Unit 4 test: systems of equations",kind:"Test"})}
    else{up.push({id:K.uid(),period:p.id,date:shift(TODAY,2),title:"Quiz: right triangles",kind:"Quiz"});up.push({id:K.uid(),period:p.id,date:shift(TODAY,10),title:"Bridge design project checkpoint",kind:"Project"})}});
  return {periods:P,days:days,up:up,period:"p0"};
}
var S=K.load(KEY,sample),date=TODAY,student=location.hash.indexOf("student")>=0;
function save(){K.save(KEY,S)}
function snap(){return JSON.stringify(S)}
function restore(j){S=JSON.parse(j);save();draw()}
function entry(pid,dt){return S.days.filter(function(d){return d.period===pid&&d.date===dt})[0]}
function draw(){
  document.body.classList.toggle("student",student);
  $("mode").innerHTML='<button type="button" data-v="t" aria-pressed="'+!student+'">Teacher view</button><button type="button" data-v="s" aria-pressed="'+student+'">Student view</button>';
  if(!S.periods.some(function(p){return p.id===S.period}))S.period=S.periods.length?S.periods[0].id:"";
  var per=S.periods.filter(function(p){return p.id===S.period})[0],e=per?entry(per.id,date):null;
  var up=S.up.filter(function(u){return per&&u.period===per.id&&u.date>=TODAY}).sort(function(a,b){return a.date<b.date?-1:1});
  var steps=e?e.steps.split("\n").map(function(x){return x.trim()}).filter(Boolean):[];
  var main;
  if(!per)main='<div class="panel"><p class="empty">No class periods yet. Add one to get started.</p></div>';
  else if(e)main='<div class="two"><div class="panel"><div class="target"><span class="lab">Learning target</span><p>'+esc(e.target)+'</p></div>'+
      (e.donow?'<div class="blk"><span class="lab">Do now</span><p>'+esc(e.donow)+'</p></div>':'')+
      '<div class="blk"><span class="lab">Today\'s agenda</span><ul class="steps">'+(steps.map(function(s,i){var on=e.done.indexOf(i)>=0;return '<li class="'+(on?"done":"")+'"><label><input type="checkbox" data-step="'+i+'"'+(on?" checked":"")+(student?" disabled":"")+'><span>'+esc(s)+'</span></label></li>'}).join("")||'<li class="muted">No steps listed.</li>')+'</ul></div>'+
      '<div class="teach-only" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn filled" type="button" id="edit">'+sym("edit")+'Edit agenda</button><button class="btn tonal" type="button" id="copyto">'+sym("content_copy")+'Copy to another period</button></div></div>'+
     '<div style="display:grid;gap:24px;align-content:start;min-width:0">'+(e.hw?'<div class="hw"><span class="lab" style="font:500 .75rem/1rem var(--md-font);letter-spacing:.08em;text-transform:uppercase">Homework</span><p style="font:500 1.125rem/1.625rem var(--md-font)">'+esc(e.hw)+'</p>'+(e.due?'<span class="small">Due '+nice(e.due)+'</span>':'')+'</div>':'')+upcoming(up)+'</div></div>';
  else main='<div class="two"><div class="panel"><p class="empty">'+(student?"Nothing is posted for this day yet.":"No agenda for this class on this day yet.")+'</p><div class="teach-only" style="display:flex;justify-content:center"><button class="btn filled" type="button" id="edit">'+sym("add")+'Add agenda</button></div></div><div style="display:grid;gap:24px;align-content:start;min-width:0">'+upcoming(up)+'</div></div>';
  $("app").innerHTML=
   '<div class="ph"><div class="ptabs" role="group" aria-label="Class period">'+S.periods.map(function(p){return '<button class="ptab" type="button" data-p="'+p.id+'" aria-pressed="'+(p.id===S.period)+'"><b>'+esc(p.name)+'</b><span>'+esc(p.course)+'</span></button>'}).join("")+'</div><div class="teach-only" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outlined sm" type="button" id="ed-p"'+(per?"":" disabled")+'>Edit this period</button><button class="btn tonal sm" type="button" id="add-p">'+sym("add")+'Add period</button></div></div>'+
   '<div class="datebar"><button class="iconb" type="button" id="prev" aria-label="Previous day">'+sym("chevron_left")+'</button><h2>'+nice(date)+(date===TODAY?' <span class="pill info">Today</span>':'')+'</h2><button class="iconb" type="button" id="nextd" aria-label="Next day">'+sym("chevron_right")+'</button>'+(date!==TODAY?'<button class="btn text sm" type="button" id="today">Back to today</button>':'')+'</div>'+main+
   '<div class="built teach-only"><b>How this was built</b><span>Built in Gemini Canvas, then connected to a Google Sheet with tabs named <code>Periods</code>, <code>Agendas</code>, and <code>Upcoming</code>. The teacher edits. Each class group has view rights, so the link posted in Google Classroom opens the student view. Kit file <code>16_agenda_board.md</code> has the prompts. Changes on this demo save in your browser only.</span></div>';
}
function upcoming(up){
  return '<div class="panel"><div class="ph"><h2>Coming up</h2><button class="btn tonal sm teach-only" type="button" id="add-u">'+sym("add")+'Add</button></div><ul class="list">'+(up.map(function(u){var cls=u.kind==="Test"?"bad":u.kind==="Quiz"?"warn":"info";return '<li class="row"><span class="pill '+cls+'">'+esc(u.kind)+'</span><span class="grow"><b>'+short(u.date)+'</b> '+esc(u.title)+'</span><button class="iconb teach-only" type="button" data-u="'+u.id+'" aria-label="Edit '+esc(u.title)+'">'+sym("edit")+'</button></li>'}).join("")||'<li class="empty">Nothing scheduled.</li>')+'</ul></div>';
}
var AF=[{k:"target",l:"Learning target",type:"textarea",ph:"I can ..."},{k:"donow",l:"Do now",type:"textarea"},{k:"steps",l:"Agenda, one step per line",type:"textarea"},{k:"hw",l:"Homework"},{k:"due",l:"Homework due",type:"date"}];
function uFields(){return [{k:"title",l:"What is coming up"},{k:"date",l:"Date",type:"date"},{k:"kind",l:"Type",type:"select",options:["Test","Quiz","Project","Other"]},{k:"period",l:"Class period",type:"select",options:S.periods.map(function(p){return [p.id,p.name+", "+p.course]})}]}
$("mode").addEventListener("click",function(e){var b=e.target.closest("[data-v]");if(b){student=b.dataset.v==="s";draw()}});
$("app").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.p){S.period=d.p;save();draw();return}
  if(t.id==="prev"){date=shift(date,-1);draw();return}
  if(t.id==="nextd"){date=shift(date,1);draw();return}
  if(t.id==="today"){date=TODAY;draw();return}
  if(student)return;
  var per=S.periods.filter(function(p){return p.id===S.period})[0],en=per?entry(per.id,date):null;
  if(t.id==="edit"){
    K.form({title:(en?"Edit":"Add")+" agenda, "+per.name,fields:AF,values:en||{due:shift(date,1)},
      onSave:function(v){if(en){en.target=v.target;en.donow=v.donow;if(en.steps!==v.steps)en.done=[];en.steps=v.steps;en.hw=v.hw;en.due=v.due}else S.days.push({id:K.uid(),period:per.id,date:date,target:v.target,donow:v.donow,steps:v.steps,done:[],hw:v.hw,due:v.due});save();draw()},
      onDelete:en?function(){var before=snap();S.days=S.days.filter(function(x){return x!==en});save();draw();K.toast("Agenda deleted.",function(){restore(before)})}:null})}
  else if(t.id==="copyto"){var others=S.periods.filter(function(p){return p.id!==per.id});if(!others.length){K.toast("Add another period first.");return}
    K.form({title:"Copy this agenda to",fields:[{k:"to",l:"Class period",type:"select",options:others.map(function(p){return [p.id,p.name+", "+p.course]})}],values:{to:others[0].id},
      onSave:function(v){var before=snap();S.days=S.days.filter(function(x){return !(x.period===v.to&&x.date===date)});S.days.push({id:K.uid(),period:v.to,date:date,target:en.target,donow:en.donow,steps:en.steps,done:[],hw:en.hw,due:en.due});save();draw();K.toast("Agenda copied.",function(){restore(before)})}})}
  else if(t.id==="add-u")K.form({title:"Add something coming up",fields:uFields(),values:{date:shift(TODAY,7),kind:"Quiz",period:S.period},onSave:function(v){v.id=K.uid();if(!v.date)v.date=TODAY;S.up.push(v);save();draw()}});
  else if(d.u){var u=S.up.filter(function(x){return x.id===d.u})[0];
    K.form({title:"Edit",fields:uFields(),values:u,onSave:function(v){u.title=v.title;u.date=v.date||u.date;u.kind=v.kind;u.period=v.period;save();draw()},
      onDelete:function(){var before=snap();S.up=S.up.filter(function(x){return x!==u});save();draw();K.toast("Deleted.",function(){restore(before)})}})}
  else if(t.id==="add-p")K.form({title:"Add period",fields:[{k:"name",l:"Period name",ph:"7th Period"},{k:"course",l:"Course"}],values:{},onSave:function(v){v.id=K.uid();S.periods.push(v);S.period=v.id;save();draw()}});
  else if(t.id==="ed-p")K.form({title:"Edit period",fields:[{k:"name",l:"Period name"},{k:"course",l:"Course"}],values:per,onSave:function(v){per.name=v.name;per.course=v.course;save();draw()},
      onDelete:function(){var before=snap();S.periods=S.periods.filter(function(x){return x!==per});S.days=S.days.filter(function(x){return x.period!==per.id});S.up=S.up.filter(function(x){return x.period!==per.id});save();draw();K.toast("Period and its agendas deleted.",function(){restore(before)})}});
});
$("app").addEventListener("change",function(e){
  var i=e.target.dataset.step;if(i===undefined||student)return;
  var en=entry(S.period,date);if(!en)return;i=+i;
  var k=en.done.indexOf(i);if(e.target.checked&&k<0)en.done.push(i);if(!e.target.checked&&k>=0)en.done.splice(k,1);save();draw();
});
$("reset").addEventListener("click",function(){var before=snap();S=sample();date=TODAY;save();draw();K.toast("Sample restored.",function(){restore(before)})});
draw();
})();
</script>
</body>
</html>
