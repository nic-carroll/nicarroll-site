<style>
/* Material Design 3, light scheme. Color roles, type scale, shape scale, elevation and state layers follow m3.material.io.
   Layout: small top app bar, one centered column, summary cards first, then controls, then detail. */
:root{
  color-scheme:light;
  /* color roles */
  --md-primary:#0B57D0; --md-on-primary:#FFFFFF;
  --md-primary-container:#D3E3FD; --md-on-primary-container:#041E49;
  --md-secondary-container:#C2E7FF; --md-on-secondary-container:#001D35;
  --md-tertiary:#146C2E; --md-tertiary-container:#C4EED0; --md-on-tertiary-container:#072711;
  --md-error:#B3261E; --md-error-container:#F9DEDC; --md-on-error-container:#410E0B;
  --md-surface:#F8FAFD; --md-surface-container-lowest:#FFFFFF; --md-surface-container-low:#F3F6FB;
  --md-surface-container:#F0F4F9; --md-surface-container-high:#E9EEF6; --md-surface-container-highest:#DDE3EA;
  --md-on-surface:#1F1F1F; --md-on-surface-variant:#444746;
  --md-outline:#747775; --md-outline-variant:#C4C7C5;
  --md-inverse-surface:#303030; --md-inverse-on-surface:#F2F2F2; --md-inverse-primary:#A8C7FA;
  /* extended color: caution */
  --md-caution:#8A5300; --md-caution-container:#FFE0B2; --md-on-caution-container:#2B1700;
  /* shape scale */
  --md-shape-xs:4px; --md-shape-s:8px; --md-shape-m:12px; --md-shape-l:16px; --md-shape-xl:28px; --md-shape-full:999px;
  /* elevation */
  --md-elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --md-elev-3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --md-font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --field-bg:var(--md-surface);
}
*{box-sizing:border-box}
body{margin:0;background:var(--md-surface);color:var(--md-on-surface);font:400 1rem/1.5rem var(--md-font);letter-spacing:.031em}
/* type scale */
h1,h2,h3{margin:0;font-family:var(--md-font);text-wrap:balance}
h1{font:400 1.375rem/1.75rem var(--md-font);letter-spacing:0}            /* title large */
h2{font:400 1.375rem/1.75rem var(--md-font);letter-spacing:0}            /* title large */
h3{font:500 1rem/1.5rem var(--md-font);letter-spacing:.009em}            /* title medium */
p{margin:0}
.muted{color:var(--md-on-surface-variant)}
.small{font:400 .875rem/1.25rem var(--md-font);letter-spacing:.016em}    /* body medium */
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--md-primary);outline-offset:2px}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.ico.ico-fill{fill:currentColor;stroke:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* top app bar, small */
.bar{background:var(--md-surface-container);color:var(--md-on-surface);position:sticky;top:0;z-index:20}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.bar .lead{width:40px;height:40px;border-radius:var(--md-shape-m);background:var(--md-primary-container);color:var(--md-on-primary-container);display:grid;place-items:center;flex:none}
.bar .sub{font:400 .75rem/1rem var(--md-font);letter-spacing:.033em;color:var(--md-on-surface-variant)}
.sp{flex:1}
.badge{font:500 .75rem/1rem var(--md-font);letter-spacing:.042em;height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--md-shape-s);border:1px solid var(--md-outline-variant);color:var(--md-on-surface-variant)}
main.wrap{padding:24px 24px 96px;display:grid;gap:24px}
[hidden]{display:none !important}

/* common buttons: 40 high, full shape, label large */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:var(--md-shape-full);border:0;font:500 .875rem/1.25rem var(--md-font);letter-spacing:.007em;background:transparent;white-space:nowrap;transition:box-shadow .15s,background-color .15s}
.btn .ico{width:18px;height:18px;margin-left:-8px}
.btn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.btn.filled:hover{box-shadow:var(--md-elev-1);background:color-mix(in srgb,var(--md-on-primary) 8%,var(--md-primary))}
.btn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn.tonal:hover{box-shadow:var(--md-elev-1);background:color-mix(in srgb,var(--md-on-secondary-container) 8%,var(--md-secondary-container))}
.btn.outlined{border:1px solid var(--md-outline);color:var(--md-primary)}
.btn.text{color:var(--md-primary);padding:0 12px}
.btn.outlined:hover,.btn.text:hover{background:color-mix(in srgb,var(--md-primary) 8%,transparent)}
.btn.danger{color:var(--md-error)}
.btn.danger:hover{background:color-mix(in srgb,var(--md-error) 8%,transparent)}
.btn.sm{height:32px;padding:0 16px}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
/* standard icon button: 40 target, state layer */
.iconb{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--md-on-surface-variant);flex:none}
.iconb .ico{width:20px;height:20px}
.iconb:hover{background:color-mix(in srgb,var(--md-on-surface-variant) 8%,transparent)}
/* extended FAB */
.fab{position:fixed;right:24px;bottom:24px;height:56px;padding:0 20px 0 16px;border:0;border-radius:var(--md-shape-l);background:var(--md-primary-container);color:var(--md-on-primary-container);box-shadow:var(--md-elev-3);display:inline-flex;align-items:center;gap:12px;font:500 .875rem/1.25rem var(--md-font);letter-spacing:.007em;z-index:30}
.fab:hover{background:color-mix(in srgb,var(--md-on-primary-container) 8%,var(--md-primary-container))}

/* cards: medium shape */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--md-surface-container-highest);border-radius:var(--md-shape-m);padding:16px;display:grid;gap:4px;position:relative;overflow:hidden}   /* filled card */
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--md-primary)}
.kpi.good::before{background:var(--md-tertiary)} .kpi.warn::before{background:var(--md-caution)} .kpi.bad::before{background:var(--md-error)}
.kpi .v{font:400 2.25rem/2.75rem var(--md-font);letter-spacing:0;font-variant-numeric:tabular-nums;padding-left:8px}   /* display small */
.kpi .k{font:500 .75rem/1rem var(--md-font);letter-spacing:.042em;color:var(--md-on-surface-variant);padding-left:8px} /* label medium */
.panel{--field-bg:var(--md-surface-container-lowest);background:var(--md-surface-container-lowest);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-m);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}   /* outlined card */
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding-top:8px}

/* outlined text fields: 56 high, extra small shape, label on the outline */
.field{position:relative;display:inline-flex;flex-direction:column;min-width:170px}
.field>span{position:absolute;left:12px;top:-8px;padding:0 4px;background:var(--field-bg);font:400 .75rem/1rem var(--md-font);letter-spacing:.033em;color:var(--md-on-surface-variant);z-index:1;pointer-events:none}
.field input,.field select,.field textarea{height:56px;width:100%;border:1px solid var(--md-outline);border-radius:var(--md-shape-xs);padding:0 16px;font:400 1rem/1.5rem var(--md-font);letter-spacing:.031em;background:transparent;color:var(--md-on-surface)}
.field textarea{height:auto;min-height:112px;padding:16px;resize:vertical}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--md-on-surface)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-primary)}
.field:focus-within>span{color:var(--md-primary)}
td select{height:36px;min-width:150px;max-width:100%;border:1px solid var(--md-outline);border-radius:var(--md-shape-s);padding:0 8px;font:400 .875rem/1.25rem var(--md-font);background:transparent}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:24px;align-items:start}
/* linear progress style bars: 4 high track is the spec; 8 here so seat counts stay readable */
.bars{display:grid;gap:12px}
.barrow{display:grid;gap:4px}
.barrow .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font:400 .875rem/1.25rem var(--md-font);letter-spacing:.016em}
.barrow .t b{font-weight:500}
.barrow .t .r{font-variant-numeric:tabular-nums;color:var(--md-on-surface-variant);white-space:nowrap;display:flex;align-items:center;gap:8px}
.track{height:8px;border-radius:var(--md-shape-full);background:var(--md-surface-container-highest);overflow:hidden}
.fill{height:100%;border-radius:var(--md-shape-full);background:var(--md-primary)}
.fill.near{background:var(--md-caution)} .fill.full{background:var(--md-error)}

.tablebox{overflow-x:auto;border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-m)}
table{border-collapse:collapse;width:100%;font:400 .875rem/1.25rem var(--md-font);letter-spacing:.016em}
th,td{text-align:left;padding:8px 16px;height:52px;border-bottom:1px solid var(--md-outline-variant)}
th,td.nw{white-space:nowrap}
.tablebox.scroll{max-height:600px;overflow:auto}
th{position:sticky;top:0;height:56px;background:var(--md-surface-container-low);font:500 .875rem/1.25rem var(--md-font);letter-spacing:.007em;color:var(--md-on-surface-variant);z-index:1}
tbody tr:hover{background:color-mix(in srgb,var(--md-on-surface) 4%,transparent)}
tr:last-child td{border-bottom:0}
/* status labels, shaped like chips */
.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--md-shape-s);font:500 .75rem/1rem var(--md-font);letter-spacing:.042em}
.pill.ok{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.pill.warn{background:var(--md-caution-container);color:var(--md-on-caution-container)}
.pill.bad{background:var(--md-error-container);color:var(--md-on-error-container)}
.pill.info{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.st{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--md-outline)}
.dot.ok{background:var(--md-tertiary)} .dot.warn{background:var(--md-caution)} .dot.bad{background:var(--md-error)} .dot.info{background:var(--md-primary)}
.cols4{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.bar a.btn{text-decoration:none}
.btn.text .ico{margin-left:0}
.empty{padding:24px;text-align:center;color:var(--md-on-surface-variant)}

/* segmented buttons */
.seg{display:inline-flex;border:1px solid var(--md-outline);border-radius:var(--md-shape-full);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font:500 .875rem/1.25rem var(--md-font);letter-spacing:.007em;color:var(--md-on-surface)}
.seg button+button{border-left:1px solid var(--md-outline)}
.seg button:hover{background:color-mix(in srgb,var(--md-on-surface) 8%,transparent)}
.seg button[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.seg button[aria-pressed="true"]::before{content:"\2713";font-size:16px;line-height:1;font-weight:700}

.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{background:var(--md-surface-container-low);border-radius:var(--md-shape-m);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--md-elev-1)}   /* elevated card */
.tcard.can{background:var(--md-surface-container-lowest)}
.tcard:not(.can){box-shadow:none;background:var(--md-surface-container-highest)}   /* filled card for locked sections */
/* lists: one line items, 48 min height */
.list{list-style:none;margin:0;padding:0;display:grid;font:400 .875rem/1.25rem var(--md-font);letter-spacing:.016em}
.row{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 0 4px 8px;border-bottom:1px solid var(--md-outline-variant);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere;padding:6px 0}
.row input[type=checkbox]{width:18px;height:18px;margin:0 8px 0 3px;accent-color:var(--md-primary);flex:none}
.row.done .grow{text-decoration:line-through;color:var(--md-on-surface-variant)}
.quick{display:flex;gap:8px;margin-top:auto;align-items:center}
.quick input{flex:1;min-width:0;height:40px;border:1px solid var(--md-outline);border-radius:var(--md-shape-xs);padding:0 12px;background:transparent;font:400 .875rem/1.25rem var(--md-font)}
.quick input:focus{outline:none;border-color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-primary)}
.lock{margin-top:auto;display:flex;gap:8px;align-items:center;font:400 .75rem/1rem var(--md-font);letter-spacing:.033em;color:var(--md-on-surface-variant)}

/* basic dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px;z-index:50}
.scrim[hidden]{display:none}
.dialog{--field-bg:var(--md-surface-container-high);background:var(--md-surface-container-high);border-radius:var(--md-shape-xl);padding:24px;width:min(480px,100%);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:24px;box-shadow:var(--md-elev-3)}
.dialog h2{font:400 1.5rem/2rem var(--md-font)}   /* headline small */
.k-fields{display:grid;gap:24px;padding-top:8px}
.k-fields .field{display:flex}
.dlg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* snackbar */
.snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);min-height:48px;background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);border-radius:var(--md-shape-xs);padding:4px 8px 4px 16px;display:flex;gap:8px;align-items:center;box-shadow:var(--md-elev-3);z-index:60;font:400 .875rem/1.25rem var(--md-font);letter-spacing:.016em;max-width:calc(100% - 32px)}
.snack[hidden]{display:none}
.snack button{border:0;background:transparent;color:var(--md-inverse-primary);font:500 .875rem/1.25rem var(--md-font);height:40px;padding:0 12px;border-radius:var(--md-shape-full)}
.built{background:var(--md-surface-container);border-radius:var(--md-shape-m);padding:16px;display:grid;gap:4px;font:400 .875rem/1.25rem var(--md-font);letter-spacing:.016em;color:var(--md-on-surface-variant)}
.built b{color:var(--md-on-surface);font-weight:500}
code{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:.8125rem;background:var(--md-surface-container-highest);padding:1px 6px;border-radius:var(--md-shape-xs)}
@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.tgrid,.cols4{grid-template-columns:1fr !important}
  .wrap{padding:0 16px}
  main.wrap{padding:16px 16px 96px}
  .fab{right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* inside the playbook page the tool hides its own back link */
.embed a[href*="S9bGSH6neDDqR6Y5qSjhAq"]{display:none}

/* data sources panel, added to every tool by kit.js */
#k-sources{padding-bottom:72px;margin-top:-64px}
#k-sources a{color:var(--md-primary)}
.k-src-jump{text-decoration:none}
.k-formula{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--md-surface-container);border-radius:var(--md-shape-s);padding:8px 8px 8px 12px;margin-bottom:8px}
.k-formula code{flex:1;min-width:0;overflow-wrap:anywhere;background:transparent;padding:0}
body.arena #k-sources,body.student #k-sources,body.present #k-sources,.embed .k-src-jump{display:none}
body.arena .k-src-jump,body.student .k-src-jump,body.present .k-src-jump{display:none}

#k-status{height:auto;min-height:28px;padding:4px 10px;white-space:normal;max-width:100%;text-align:left}
body.arena #k-status,body.student #k-status,body.present #k-status{display:none}

</style>
<style>

<script>
/* Shared by every tool: the "Link a Google Sheet" steps and the backup and restore tools.
   In a real copy that runs as an Apps Script web app, step 1 asks the script for the Sheet's name and tabs.
   In this preview there is no signed in Google account, so the teacher types them or tries a sample Sheet. */
var KLink=(function(){
  "use strict";
  var P="var(--md-primary,var(--primary))",OV="var(--md-on-surface-variant,var(--on-surface-variant))",OL="var(--md-outline-variant,var(--outline-variant,#C4C7C5))";
  var st=document.createElement("style");
  st.textContent=".kl-step{font-size:.75rem;line-height:1rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:"+P+";margin:0}"+
   ".kl-body{display:flex;flex-direction:column;gap:20px;min-width:0}"+
   ".kl-help{font-size:.875rem;line-height:1.25rem;color:"+OV+";margin:0}"+
   ".kl-err{font-size:.875rem;line-height:1.25rem;color:var(--md-error,var(--error,#B3261E));margin:0}"+
   ".kl-note{font-size:.875rem;line-height:1.25rem;border-radius:12px;padding:12px 16px;background:var(--md-caution-container,#FFE0B2);color:var(--md-on-caution-container,#2B1700);margin:0}"+
   ".kl-samples{display:flex;flex-wrap:wrap;gap:8px;align-items:center}"+
   ".kl-samples button,.kl-tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid "+OL+";border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:.875rem;line-height:1.25rem;font-weight:500;overflow-wrap:anywhere;text-align:left}"+

        (list.map(function(s){return '<tr><td><b style="font-weight:500">'+esc(s.name)+'</b></td><td>'+esc(s.tabs)+'</td><td>'+esc(s.use)+(s.map?'<br><span class="pill ok" style="margin-top:4px">Columns matched</span>':'')+'</td><td>'+(s.mode==="save"?'<span class="pill ok">Reads and saves</span>':'<span class="pill info">Reference, read only</span>')+'</td><td class="nw">'+(ok(s.url)?(/\/d\/sample-/.test(s.url)?'<span class="pill info">Sample Sheet</span>':'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">Open Sheet</a>'):s.url?'<span class="pill warn">Check the link</span>':'<span class="muted">Sample, not linked</span>')+'</td><td class="nw"><button class="iconb" type="button" data-ksrc="'+s.id+'" aria-label="Edit '+esc(s.name)+'">'+icon("edit")+'</button></td></tr>'}).join("")||'<tr><td colspan="6" class="empty">No Sheets linked yet.</td></tr>')+
        '</tbody></table></div>'+
        (refs.length?'<div><p class="small" style="margin-bottom:8px">One formula for each tab you chose. Paste each one into cell A1 of a new tab in your main Sheet. It pulls that tab in and keeps it up to date, with no script. For a roster with matched columns, the formula also puts your columns in the standard order with the standard names.</p>'+refs.map(function(s){return KLink.formulas(s).map(function(x,i){return '<div class="k-formula"><code>'+esc(x.f)+'</code><button class="btn text sm" type="button" data-kcopy="'+s.id+'|'+i+'">Copy</button></div>'}).join("")}).join("")+'</div>':'')+
        '<p class="muted small">On this demo, links are saved in your browser only. The real tool keeps this list on a tab named <code>Sources</code>. Kit file <code>18_data_without_apps_script.md</code> explains how each tool saves to Sheets without Apps Script.</p></div>'+
        '<div class="panel" style="margin-top:24px">'+
        (function(){var z=KStd.summary(),hook=typeof window.KSTD_APPLY==="function";return '<div class="ph"><div><h2>Georgia standards</h2><p class="muted small">Tell the tool what you teach once. After that you click standards and never type a code.</p></div><span class="pill '+(z.sample?"warn":"ok")+'" id="k-stdstat">'+(z.sample?"Sample list, short labels":z.count+" official standards loaded")+'</span></div>'+
        '<p class="small"><b style="font-weight:500">My grades:</b> '+(z.grades.length?esc(z.grades.join(", ")):"all")+'. <b style="font-weight:500">My subjects:</b> '+(z.subjects.length?esc(z.subjects.join(", ")):"all")+'. <span class="muted">'+z.mine+' standards match.</span></p>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn tonal sm" type="button" data-kstd="setup">'+icon("school")+'Choose my grades and subjects</button>'+(hook?'<button class="btn filled sm" type="button" data-kstd="pick">'+icon("add")+'Pick standards for this tool</button>':'')+'</div>'+
        '<p class="muted small">Kit file <code>31_georgia_standards.md</code> shows how a district loads the official list once for everyone.</p></div><div class="panel" style="margin-top:24px">'})()+
        '<div class="ph"><div><h2>Saving</h2><p class="muted small" id="k-syncline"></p></div>'+(KLink.live()?'<button class="btn tonal sm" type="button" data-kbk="sync">Save to the Sheet now</button>':'')+'</div></div><div class="panel" style="margin-top:24px">'+
        '<div class="ph"><div><h2>Back up and restore</h2><p class="muted small">A backup is one file with everything in this tool: your data and your linked Sheets.</p></div><span class="pill '+(lb?"ok":"warn")+'" id="k-lastb">'+(lb?"Last backup: "+esc(lb):"No backup yet")+'</span></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn filled sm" type="button" data-kbk="down">'+icon("download")+'Download a backup</button><button class="btn tonal sm" type="button" data-kbk="copy">'+icon("content_copy")+'Copy backup as text</button><button class="btn outlined sm" type="button" data-kbk="restore">'+icon("restart_alt")+'Restore from a backup</button></div>'+
        '<p class="muted small">In your real tool the Google Sheet is the database, so there are two more safety nets. In the Sheet, choose File, then Make a copy, at the end of each grading period. And File, then Version history, lets you roll back to any earlier day. Kit file <code>26_link_sheets_and_back_up.md</code> has the steps.</p></div>';
    }
    sec.addEventListener("click",function(e){
      var c=e.target.closest("[data-kcopy]");
      if(c){var pr=c.dataset.kcopy.split("|"),s0=list.filter(function(x){return x.id===pr[0]})[0],ft=KLink.formulas(s0)[+pr[1]].f,done=function(g){toast(g?"Formula copied.":"Select the formula and copy it.")};try{navigator.clipboard.writeText(ft).then(function(){done(true)},function(){done(false)})}catch(err){done(false)}return}
      var sd=e.target.closest("[data-kstd]");
      if(sd){if(sd.dataset.kstd==="setup")KStd.setup(function(){draw();toast("Saved. Your standards list is ready.")});else KStd.pick({title:"Pick standards for this tool",onDone:function(list){if(!list.length){toast("No standards were picked.");return}var r=window.KSTD_APPLY(list);toast(list.length+(list.length===1?" standard":" standards")+" added to this tool."+(list[0].official?"":" These are sample labels, not the official wording."))}});return}
      var k=e.target.closest("[data-kbk]");
      if(k){var w=k.dataset.kbk;
        if(w==="sync"){sync();toast(navigator.onLine===false?"You are offline. It will save when you are back online.":"Saving to your Sheet.")}
        else if(w==="down"){KLink.download(title,bkeys,function(okk,nm){draw();toast(okk===false?"The file could not be saved here. Use Copy backup as text instead.":okk?"Backup saved as "+nm:"Backup sent to your Downloads folder as "+nm+". If no file appears, use Copy backup as text.")})}
        else if(w==="copy"){var tx=KLink.backupText(title,bkeys),fin=function(g){toast(g?"Backup copied. Paste it into a Google Doc to keep it.":"Copying is blocked here. Use Download a backup.")};try{navigator.clipboard.writeText(tx).then(function(){fin(true)},function(){fin(false)})}catch(err){fin(false)}}
        else KLink.restore(title,bkeys);
        return}
      var b=e.target.closest("[data-ksrc]");if(!b)return;
      if(b.dataset.ksrc==="add"){KLink.open({source:null,spec:specFor("Class Roster","Roster"),onSave:function(v){v.id=uid();list.push(v);save(key,list);draw();toast(v.name+" linked.")}});return}
      var s=list.filter(function(x){return x.id===b.dataset.ksrc})[0];
      KLink.open({source:s,spec:specFor(s.name,s.tabs),onSave:function(v){s.name=v.name;s.url=v.url;s.tabs=v.tabs;s.allTabs=v.allTabs;s.use=v.use;s.mode=v.mode;s.kind=v.kind;s.cols=v.cols;s.map=v.map;save(key,list);draw()},
        onDelete:function(){var before=JSON.stringify(list);list=list.filter(function(x){return x!==s});save(key,list);draw();toast("Data source removed.",function(){list=JSON.parse(before);save(key,list);draw()})}});
    });
    draw();syncInit();var d0=draw;draw=function(){d0();status()};
    if(KLink.justRestored(title))toast("Backup restored.");
  }
  if(document.readyState==="complete")setTimeout(sources,0);else window.addEventListener("load",sources);

  return {icon:icon,esc:esc,uid:uid,load:load,save:save,form:form,toast:toast,ICON:ICON};
})();

</script>
<script>
(function(){
"use strict";
var KEY="demo-mastery-v1",$=function(id){return document.getElementById(id)},esc=K.esc;
function sym(n,c,s){return K.icon(n,c,s)}
var NAMES=["Avery B.","Jordan C.","Maya N.","Elijah H.","Sofia R.","Noah W.","Zoe B.","Liam C.","Aaliyah N.","Mateo H.","Harper R.","Isaiah W.","Chloe B.","Diego C.","Nia N.","Owen H.","Layla R.","Caleb W.","Ruby B.","Mason C.","Imani N.","Lucas H.","Ella R.","Jayden W."];
var LEVELS=["Not assessed","Beginning","Developing","Proficient","Distinguished"];
function level(v){return v===undefined||v===null||v===""?0:v<50?1:v<70?2:v<90?3:4}
function sample(){
  var stds=[{code:"3.NR.1",label:"Place value and rounding, numbers up to 10,000"},{code:"3.PAR.2",label:"Addition and subtraction within 10,000"},{code:"3.PAR.3",label:"Multiplication and division within 100"},{code:"3.NR.4",label:"Fractions with denominators 2, 3, 4, 6, and 8"},{code:"3.MDR.5",label:"Measurement problems, including time"},{code:"3.GSR.7",label:"Area of rectangles"}];
  var base=[86,82,71,58,0,0],students=[],scores={};
  NAMES.forEach(function(n,i){var id="s"+i;students.push({id:id,name:n});scores[id]={};
    stds.forEach(function(s,j){if(j>=4)return;var skill=((i*37)%41)-20,wob=((i*13+j*29)%23)-11,v=Math.max(20,Math.min(100,base[j]+skill+wob));
      if(j===3&&i%9===4)return;scores[id][s.code]=Math.round(v/5)*5})});
  return {students:students,standards:stds,scores:scores,sel:"3.NR.4"};
}
var S=K.load(KEY,sample);
function save(){K.save(KEY,S)}
window.KSTD_APPLY=function(list){list.forEach(function(x){var s=S.standards.filter(function(y){return y.code===x.code})[0];if(s){s.label=x.text;s.full=!!x.official}else S.standards.push({code:x.code,label:x.text,full:!!x.official})});save();draw()};
function official(code,ph){var s=S.standards.filter(function(y){return y.code===code})[0];return s&&s.full?s.label:ph}
function snap(){return JSON.stringify(S)}
function restore(j){S=JSON.parse(j);save();draw()}
function val(sid,code){var r=S.scores[sid];return r?r[code]:undefined}
function avg(code){var a=S.students.map(function(s){return val(s.id,code)}).filter(function(v){return level(v)>0});return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):null}
function ns(n){return n+(n===1?" student":" students")}
function prompt(code){
  var std=S.standards.filter(function(s){return s.code===code})[0];if(!std)return "";
  var c=[0,0,0,0,0];S.students.forEach(function(s){c[level(val(s.id,code))]++});
  return "I teach Grade 3 in Georgia. My class took an exit ticket on one standard.\n\nStandard code: "+std.code+"\n"+(std.full?"Official wording: "+std.label:"Topic: "+std.label+"\nOfficial wording from SuitCASE: [paste the standard here]")+"\n\nResults, with no student names:\n* Beginning (below 50%): "+ns(c[1])+"\n* Developing (50 to 69%): "+ns(c[2])+"\n* Proficient (70 to 89%): "+ns(c[3])+"\n* Distinguished (90% and up): "+ns(c[4])+"\n* Not assessed yet: "+ns(c[0])+"\n\nCommon mistakes I saw: [describe what students got wrong]\n\nWrite a reteaching plan:\n1. A 15 minute small group lesson for the Beginning group, with hands on materials\n2. A 15 minute small group lesson for the Developing group\n3. An extension task the Proficient and Distinguished students can do on their own while I teach\n4. A new 4 question exit ticket to check again, with an answer key\n\nKeep it practical for one teacher with no helper.";
}
function draw(){
  if(!S.standards.some(function(s){return s.code===S.sel}))S.sel=S.standards.length?S.standards[0].code:"";
  var assessed=S.standards.filter(function(s){return avg(s.code)!==null}),mastered=assessed.filter(function(s){return avg(s.code)>=70}).length;
  var all=[];S.students.forEach(function(st){S.standards.forEach(function(s){var v=val(st.id,s.code);if(level(v)>0)all.push(v)})});
  var classAvg=all.length?Math.round(all.reduce(function(x,y){return x+y},0)/all.length):0;
  var need=S.students.filter(function(st){return S.standards.some(function(s){return level(val(st.id,s.code))===1})}).length;
  var sel=S.sel,groups=[[],[],[],[],[]];S.students.forEach(function(st){groups[level(val(st.id,sel))].push(st.name)});
  var selStd=S.standards.filter(function(s){return s.code===sel})[0];
  var head='<tr><th>Student</th>'+S.standards.map(function(s){return '<th><button type="button" data-sel="'+esc(s.code)+'" aria-pressed="'+(s.code===sel)+'" title="'+esc(s.label)+'">'+esc(s.code)+'</button></th>'}).join("")+'</tr>';
  var body=S.students.map(function(st){return '<tr><td><button class="btn text sm" type="button" data-stu="'+st.id+'" style="padding:0 8px">'+esc(st.name)+'</button></td>'+S.standards.map(function(s){var v=val(st.id,s.code),lv=level(v);return '<td><button class="cellb lv'+lv+'" type="button" data-cell="'+st.id+'|'+esc(s.code)+'" aria-label="'+esc(st.name)+', '+esc(s.code)+', '+(lv?v+" percent, "+LEVELS[lv]:"not assessed")+'">'+(lv?v:"+")+'</button></td>'}).join("")+'</tr>'}).join("");
  var foot='<tr><td><b>Class average</b></td>'+S.standards.map(function(s){var a=avg(s.code);return '<td><b>'+(a===null?"":a+"%")+'</b></td>'}).join("")+'</tr>';
  function names(lv,cls){return groups[lv].length?'<div class="names">'+groups[lv].map(function(n){return '<span class="'+cls+'">'+esc(n)+'</span>'}).join("")+'</div>':'<p class="muted small">No students at this level.</p>'}
  $("app").innerHTML=
  '<div class="kpis"><div class="kpi"><div class="v">'+classAvg+'%</div><div class="k">Class average, all scores</div></div><div class="kpi good"><div class="v">'+mastered+' of '+assessed.length+'</div><div class="k">Assessed standards at 70% or higher</div></div><div class="kpi '+(need?"bad":"good")+'"><div class="v">'+need+'</div><div class="k">Students with a Beginning score</div></div><div class="kpi warn"><div class="v">'+(S.standards.length-assessed.length)+'</div><div class="k">Standards not assessed yet</div></div></div>'+
  '<div class="panel"><div class="ph"><h2>Exit ticket scores by standard</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn tonal sm" type="button" id="add-stu">'+sym("add")+'Add student</button><button class="btn tonal sm" type="button" id="add-std">'+sym("add")+'Add standard</button></div></div><div class="legend"><span class="lv1">Beginning, below 50</span><span class="lv2">Developing, 50 to 69</span><span class="lv3">Proficient, 70 to 89</span><span class="lv4">Distinguished, 90 and up</span><span class="lv0">Not assessed</span></div><div class="tablebox"><table class="heat"><thead>'+head+'</thead><tbody>'+body+foot+'</tbody></table></div><p class="muted small">Select a score to change it. Select a standard code to see its reteach groups. Select a student name to rename or remove them.</p></div>'+
  (selStd?'<div class="two"><div class="panel"><div class="ph"><h2>Groups for '+esc(sel)+'</h2><button class="btn outlined sm" type="button" id="ed-std">Edit standard</button></div><p class="muted small">'+esc(selStd.label)+'</p><h3>Reteach first: Beginning</h3>'+names(1,"lv1")+'<h3>Small group practice: Developing</h3>'+names(2,"lv2")+'<h3>On track: Proficient</h3>'+names(3,"lv3")+'<h3>Ready for more: Distinguished</h3>'+names(4,"lv4")+(groups[0].length?'<h3>Not assessed yet</h3>'+names(0,"lv0"):'')+'</div>'+
   '<div class="panel"><h2>Plan the reteach with Gemini</h2><p class="muted small">The prompt sends counts only. No student names or scores leave this page.</p><pre class="prompt" id="prompt">'+esc(prompt(sel))+'</pre><div><button class="btn filled" type="button" id="copy">'+sym("content_copy")+'Copy prompt for Gemini</button></div></div></div>':'')+
  '<div class="built"><b>How this was built</b><span>Built in Gemini Canvas, then connected to a Google Sheet with tabs named <code>Students</code>, <code>Standards</code>, and <code>Scores</code>. This tool holds student records, so the Sheet is shared only with the teacher of record and approved staff, and the district privacy lead signs off first. Kit file <code>15_mastery_tracker.md</code> has the prompts. Changes on this demo save in your browser only.</span></div>';
}
$("app").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.sel){S.sel=d.sel;save();draw()}
  else if(d.cell){var p=d.cell.split("|"),sid=p[0],code=p[1],cur=val(sid,code),st=S.students.filter(function(x){return x.id===sid})[0];
    K.form({title:st.name+", "+code,fields:[{k:"score",l:"Score, 0 to 100",type:"number",min:0}],values:{score:level(cur)?cur:""},
      onSave:function(v){S.scores[sid]=S.scores[sid]||{};S.scores[sid][code]=Math.max(0,Math.min(100,v.score));save();draw()},
      onDelete:level(cur)?function(){delete S.scores[sid][code];save();draw();K.toast("Score cleared.")}:null})}
  else if(d.stu){var s=S.students.filter(function(x){return x.id===d.stu})[0];
    K.form({title:"Edit student",fields:[{k:"name",l:"Name"}],values:s,onSave:function(v){s.name=v.name;save();draw()},
      onDelete:function(){var before=snap();S.students=S.students.filter(function(x){return x!==s});delete S.scores[s.id];save();draw();K.toast("Student and scores removed.",function(){restore(before)})}})}
  else if(t.id==="add-stu")K.form({title:"Add student",fields:[{k:"name",l:"Name, first name and last initial"}],values:{},onSave:function(v){S.students.push({id:K.uid(),name:v.name});save();draw()}});
  else if(t.id==="add-std")K.form({title:"Add a standard from SuitCASE",fields:[{k:"code",l:"Standard code",ph:"3.GSR.8"},{k:"label",l:"Standard wording",type:"textarea",ph:"Paste the wording from SuitCASE"}],values:{},onSave:function(v){if(!S.standards.some(function(s){return s.code===v.code}))S.standards.push({code:v.code,label:v.label||"Added by teacher"});S.sel=v.code;save();draw()}});
  else if(t.id==="ed-std"){var sd=S.standards.filter(function(s){return s.code===S.sel})[0];
    K.form({title:"Edit standard "+sd.code,fields:[{k:"label",l:"Standard wording",type:"textarea"}],values:sd,onSave:function(v){sd.label=v.label;save();draw()},
      onDelete:function(){var before=snap();S.standards=S.standards.filter(function(x){return x!==sd});Object.keys(S.scores).forEach(function(k){delete S.scores[k][sd.code]});save();draw();K.toast("Standard and its scores removed.",function(){restore(before)})}})}
  else if(t.id==="copy"){var text=prompt(S.sel),done=function(ok){K.toast(ok?"Prompt copied. Paste it into Gemini.":"Select the prompt text and copy it.")};
    try{navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(false)})}catch(err){done(false)}}
});
$("reset").addEventListener("click",function(){var before=snap();S=sample();save();draw();K.toast("Sample class restored.",function(){restore(before)})});
draw();
})();
</script>
