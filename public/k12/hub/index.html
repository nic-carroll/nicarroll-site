<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Classroom Hub · Nic Carroll</title>
<meta name="description" content="My Classroom Hub: a working example tool from the Gemini Tool Builder Playbook for K12 by Nic Carroll. All names and records are invented sample data.">
<meta property="og:title" content="My Classroom Hub">
<meta property="og:image" content="https://niccarroll.org/assets/showcase/k12-hub.jpg">
<link rel="icon" href="../../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts.css?v=20261125">
<script src="/sitebar.js?v=20261125b" defer></script>
<style>.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.ico.ico-fill{fill:currentColor;stroke:none}

/* Material Design 3 light scheme, teal seed: color roles, type scale, shape scale, navigation rail, outlined fields, basic dialog, snackbar. Layout: navigation rail on the left, one view at a time on the right; bottom bar on phones. */
:root{
  color-scheme:light;
  --primary:#006A6A; --on-primary:#FFFFFF;
  --primary-container:#9CF1F0; --on-primary-container:#002020;
  --secondary-container:#CCE8E7; --on-secondary-container:#051F1F;
  --tertiary-container:#FFDDB8; --on-tertiary-container:#2A1700;
  --error:#BA1A1A; --error-container:#FFDAD6;
  --surface:#F6FAF9; --surface-low:#EBF2F1; --surface-high:#DFE8E7; --card:#FFFFFF;
  --on-surface:#171D1D; --on-surface-variant:#3F4948;
  --outline:#6F7979; --outline-variant:#BEC9C8;
  --note-yellow:#FFF3B0; --note-pink:#FFD9E2; --note-green:#D7F5C5; --note-blue:#D3E4FF; --note-orange:#FFDDB8;
  --font-display:"Roboto",system-ui,sans-serif;
  --font-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px;
  --surface-ch:#E3E9E8; --inverse-surface:#2D3131; --inverse-on-surface:#EFF1F0; --inverse-primary:#80D5D4; --field-bg:var(--surface-ch);
  --e2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:2.5rem;font-weight:400}
h2{font-size:1.5rem;line-height:2rem;font-weight:400} h3{font-size:1rem;line-height:1.5rem;font-weight:500;letter-spacing:.009em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.muted{color:var(--on-surface-variant)}
.app{display:grid;grid-template-columns:80px minmax(0,1fr);min-height:100%}

/* rail */
.rail{background:var(--surface-low);padding:16px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{width:48px;height:48px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--font-display);font-size:1.4rem;margin-bottom:12px}
.navb{border:0;background:transparent;width:64px;padding:6px 0;border-radius:var(--r-l);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;line-height:1rem;font-weight:500;letter-spacing:.042em;color:var(--on-surface-variant)}
.navb .ic{width:56px;height:32px;border-radius:999px;display:grid;place-items:center}
.navb:hover .ic{background:var(--surface-high)}
.navb[aria-current="page"]{color:var(--on-surface)}
.navb[aria-current="page"] .ic{background:var(--secondary-container);color:var(--on-secondary-container)}
.ico{width:24px;height:24px;}
.navb[aria-current="page"] .ico{stroke-width:2.6}

main{padding:28px 28px 96px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:999px;border:0;font-weight:500;font-size:.875rem;letter-spacing:.007em;background:transparent;white-space:nowrap}
.btn.filled:hover,.btn.tonal:hover{box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)}
.btn.outlined:hover,.btn.text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{border:1px solid var(--outline);color:var(--primary)}
.btn.text{color:var(--primary);padding:0 12px}
.btn.danger{color:var(--error)}
.btn.small{height:32px;padding:0 14px;font-size:.8125rem}
.iconb{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-variant);flex:none}
.iconb:hover{background:var(--surface-high);color:var(--on-surface)}
.iconb .ico{width:20px;height:20px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--outline-variant);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tone{background:var(--primary-container);border-color:transparent;color:var(--on-primary-container)}
.card.warm{background:var(--tertiary-container);border-color:transparent;color:var(--on-tertiary-container)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;min-height:48px;border-radius:var(--r-s);background:var(--surface-low);min-width:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--primary);flex:none}
.row.done .grow{text-decoration:line-through;color:var(--on-surface-variant)}
.row a{color:var(--primary);font-weight:600;text-decoration:none}
.row a:hover{text-decoration:underline}
.empty{color:var(--on-surface-variant);font-size:.9375rem;padding:6px 2px}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;height:40px;border:1px solid var(--outline);border-radius:var(--r-xs);padding:0 12px;background:var(--card)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--r-s);font-size:.75rem;font-weight:500;letter-spacing:.042em;background:var(--secondary-container);color:var(--on-secondary-container)}
.big{font-family:var(--font-display);font-size:2.25rem;line-height:2.75rem;font-weight:400}

/* to do board */
.days{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.day.today{border:2px solid var(--primary)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:.75rem;font-weight:700;color:var(--on-surface-variant);text-align:center;padding:4px 0}
.cell{background:var(--card);border:1px solid var(--outline-variant);border-radius:var(--r-m);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.cell.out{background:transparent;border-style:dashed;opacity:.5}
.cell.today{border:2px solid var(--primary);background:#F0FBFA}
.cell .dn{font-weight:700;font-size:.875rem;display:flex;justify-content:space-between;align-items:center}
.cell .plus{border:0;background:transparent;border-radius:50%;width:24px;height:24px;color:var(--on-surface-variant);font-size:1.1rem;line-height:1}
.cell .plus:hover{background:var(--surface-high)}
.ev{border:0;background:var(--secondary-container);color:var(--on-secondary-container);border-radius:6px;padding:3px 6px;font-size:.75rem;font-weight:600;text-align:left;overflow-wrap:anywhere;width:100%}
.ev:hover{background:var(--primary-container)}

/* ideas */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.note{border-radius:4px 4px 18px 4px;padding:14px;min-height:140px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 4px rgba(0,0,0,.15);color:#2A2A1F}
.note p{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.note .iconb{color:#2A2A1F}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px;z-index:50}
.scrim[hidden]{display:none}
.dialog{background:var(--surface-ch);border-radius:var(--r-xl);padding:24px;width:min(480px,100%);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:24px;box-shadow:var(--e2)}
.field{position:relative;display:flex;flex-direction:column;min-width:160px}
.field>span{position:absolute;left:12px;top:-8px;padding:0 4px;background:var(--field-bg);font-size:.75rem;line-height:1rem;font-weight:400;letter-spacing:.033em;color:var(--on-surface-variant);z-index:1;pointer-events:none}
.field.plain>span{position:static;padding:0 0 8px;background:none}
.field input,.field select,.field textarea{height:56px;border:1px solid var(--outline);border-radius:4px;padding:0 16px;font-size:1rem;font-weight:400;color:var(--on-surface);background:transparent;width:100%}
.field textarea{height:auto;min-height:112px;padding:16px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.field:focus-within>span{color:var(--primary)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{width:44px;height:44px;border-radius:12px;border:2px solid var(--outline-variant);background:var(--card);font-size:1.3rem;display:grid;place-items:center}
.choice[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-container)}
.dlg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:var(--r-xs);min-height:48px;padding:4px 8px 4px 16px;display:flex;gap:8px;align-items:center;box-shadow:var(--e2);z-index:60;font-size:.875rem}
.snack[hidden]{display:none}
.snack button{border:0;background:transparent;color:var(--inverse-primary);font-weight:500;padding:6px 10px;border-radius:6px}
.embed a[href*="S9bGSH6neDDqR6Y5qSjhAq"]{display:none !important}
.foot{font-size:.8125rem;color:var(--on-surface-variant);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;justify-content:flex-start;padding:6px 8px;z-index:40;border-top:1px solid var(--outline-variant);overflow-x:auto}
  .logo{display:none}
  .navb{width:72px;flex:none}
  main{padding:20px 16px 110px}
  .g2,.g3{grid-template-columns:1fr}
  .cell{min-height:64px;padding:4px}
  .ev{font-size:.6875rem;padding:2px 4px}
  .snack{bottom:88px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t"></h2>
    <div id="dlg-f" style="display:grid;gap:24px;padding-top:8px"></div>
    <div class="dlg-actions">
      <button type="button" class="btn text danger" id="dlg-del">Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="btn text" id="dlg-cancel">Cancel</button>
      <button type="submit" class="btn filled">Save</button>
    </div>
  </form>
</div>
<div class="snack" id="snack" hidden role="status"><span id="snack-t"></span><button type="button" id="snack-undo">Undo</button></div>

<script>
/* Shared by every tool: the "Link a Google Sheet" steps and the backup and restore tools.
   In a real copy that runs as an Apps Script web app, step 1 asks the script for the Sheet's name and tabs.
   In this preview there is no signed in Google account, so the teacher types them or tries a sample Sheet. */
var KLink=(function(){
  "use strict";
  var P="var(--md-primary,var(--primary))",OV="var(--md-on-surface-variant,var(--on-surface-variant))",OL="var(--md-outline-variant,var(--outline-variant,#C4C7C5))";
  var st=document.createElement("style");
  st.textContent=".kl-step{font-size:.75rem;line-height:1rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:"+P+";margin:0}"+
   ".kl-body{display:flex;flex-direction:column;gap:20px;min-width:0}"+
   ".kl-help{font-size:.875rem;line-height:1.25rem;color:"+OV+";margin:0}"+
   ".kl-err{font-size:.875rem;line-height:1.25rem;color:var(--md-error,var(--error,#B3261E));margin:0}"+
   ".kl-note{font-size:.875rem;line-height:1.25rem;border-radius:12px;padding:12px 16px;background:var(--md-caution-container,#FFE0B2);color:var(--md-on-caution-container,#2B1700);margin:0}"+
   ".kl-samples{display:flex;flex-wrap:wrap;gap:8px;align-items:center}"+
   ".kl-samples button,.kl-tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid "+OL+";border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:.875rem;line-height:1.25rem;font-weight:500;overflow-wrap:anywhere;text-align:left}"+
   ".kl-found{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 16px;background:var(--md-tertiary-container,#C4EED0);color:var(--md-on-tertiary-container,#072711);min-width:0}"+
   ".kl-found div{flex:1;min-width:0;display:grid;gap:2px}.kl-found b{font-weight:500;overflow-wrap:anywhere}.kl-found span{font-size:.75rem;line-height:1rem;overflow-wrap:anywhere}"+
   ".kl-found button{border:0;background:transparent;color:inherit;font:inherit;font-size:.875rem;font-weight:500;text-decoration:underline;padding:8px;flex:none}"+
   ".kl-tabs{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}.kl-tabs legend{font-size:.875rem;line-height:1.25rem;font-weight:500;padding:0 0 8px}"+
   ".kl-tablist{display:flex;flex-wrap:wrap;gap:8px}.kl-tab input{width:18px;height:18px;margin:0;accent-color:"+P+";flex:none}"+
   ".kl-tab:has(input:checked){background:var(--md-secondary-container,var(--secondary-container,#C2E7FF));border-color:transparent}"+
   ".kl-file{font:inherit;font-size:.875rem;max-width:100%}"+
   ".kl-hits{display:grid;gap:8px}.kl-hit{display:grid;gap:2px;text-align:left;padding:12px 16px;border:1px solid "+OL+";border-radius:12px;background:transparent;color:inherit;font:inherit;min-width:0}.kl-hit b{font-weight:500;overflow-wrap:anywhere}.kl-hit span{font-size:.75rem;line-height:1rem;color:"+OV+"}.kl-hit:hover{background:var(--md-surface-container,rgba(0,0,0,.05))}"+
   ".kl-ol{margin:0;padding-left:22px;font-size:.875rem;line-height:1.5rem}.kl-ol a{color:"+P+";font-weight:500}"+
   ".kl-spec{display:grid;gap:10px}.kl-tabspec{border:1px solid "+OL+";border-radius:12px;padding:12px;display:grid;gap:8px;min-width:0}.kl-tabhead{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.kl-tabhead b{font-weight:500}"+
   ".kl-cols{display:flex;flex-wrap:wrap;gap:6px}.kl-cols span{font-size:.8125rem;line-height:1.125rem;padding:4px 10px;border-radius:8px;background:var(--md-surface-container-highest,var(--surface-container-highest,#E1E3E1));overflow-wrap:anywhere}";
  document.head.appendChild(st);
  var host=document.createElement("div");
  host.innerHTML='<div class="scrim" id="kl-scrim" hidden><form class="dialog" id="kl-dlg" role="dialog" aria-modal="true" aria-labelledby="kl-t" novalidate><h2 id="kl-t"></h2><div class="kl-body" id="kl-body"></div><div class="dlg-actions" id="kl-act"></div></form></div>';
  document.body.appendChild(host);
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ok(u){return /^https:\/\/docs\.google\.com\/spreadsheets\/d\/[^\/\s]+/.test(u)}
  function live(){try{return !!(window.google&&google.script&&google.script.run)}catch(e){return false}}
  var SAMPLES=[
    {name:"Class Roster",url:"https://docs.google.com/spreadsheets/d/sample-class-roster/edit",tabs:["1st Period","2nd Period","3rd Period","5th Period","6th Period","Homeroom"]},
    {name:"School Calendar",url:"https://docs.google.com/spreadsheets/d/sample-school-calendar/edit",tabs:["Dates","Testing Windows","Early Release Days"]},
    {name:"Georgia Standards from SuitCASE",url:"https://docs.google.com/spreadsheets/d/sample-georgia-standards/edit",tabs:["Math","English Language Arts","Science","Social Studies"]}];
  function isSample(u){return /\/d\/sample-/.test(u)}
  var o=null,s=null,lastFocus=null,mode="";

  function close(){$("kl-scrim").hidden=true;o=null;mode="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
  function show(){lastFocus=document.activeElement;$("kl-scrim").hidden=false}

  /* ---------- link a Sheet ---------- */
  function open(opts){
    o=opts;mode="link";var src=opts.source;var SPEC=opts.spec||null;
    s=src?{step:2,url:src.url||"",name:src.name||"",all:(src.allTabs&&src.allTabs.length?src.allTabs:split(src.tabs)).slice(),picked:split(src.tabs),use:src.use||"",mode:src.mode||"ref",manual:false,err:"",busy:false,edit:true}
         :{step:1,url:"",name:"",all:[],picked:[],use:"",mode:opts.mode||"ref",manual:false,err:"",busy:false,edit:false};
    s.picked.forEach(function(t){if(s.all.indexOf(t)<0)s.all.push(t)});s.spec=SPEC||{name:"Class Roster",use:"Student names",tabs:[{name:"Roster",cols:["Last name","First name","Period","Course","Student number","Student email"]}]};
    show();render();
  }
  function split(t){return String(t||"").split(",").map(function(x){return x.trim()}).filter(Boolean)}
  function render(){
    $("kl-t").textContent=s.edit?"Edit linked Sheet":"Link a Google Sheet";
    var b="",a="";
    if(s.step==="search"){
      $("kl-t").textContent="Search My Google Drive";
      b=live()?'<p class="kl-help">Type part of the Sheet name. Only Sheets you can already open are shown.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="field" for="kl-q" style="flex:1 1 220px"><span>Sheet name</span><input id="kl-q" value="'+esc(s.q||"")+'" autocomplete="off"></label><button type="submit" class="btn filled" style="align-self:center">Search</button></div>'+
          (s.busy?'<p class="kl-help" role="status">Searching your Drive...</p>':'')+(s.err?'<p class="kl-err" role="alert">'+esc(s.err)+'</p>':'')+
          (s.hits?(s.hits.length?'<div class="kl-hits">'+s.hits.map(function(x,i){return '<button type="button" class="kl-hit" data-klh="'+i+'"><b>'+esc(x.name)+'</b><span>'+esc(x.updated||"")+'</span></button>'}).join("")+'</div>':'<p class="kl-help">No Sheets matched. Try fewer letters.</p>'):'')
        :'<p class="kl-note">This preview is not signed in to Google, so it cannot search your Drive here. In your own copy, you type a name and pick the Sheet from a list.</p>'+
          '<ol class="kl-ol"><li><a href="https://drive.google.com/drive/search?q=type:spreadsheet" target="_blank" rel="noopener">Open My Google Drive, Sheets Only</a>. It opens in a new tab.</li><li>Right click the Sheet you want, then click <b>Share</b>, then <b>Copy link</b>.</li><li>Come back here, select <b>Back</b>, and paste the link.</li></ol>'+
          '<p class="kl-help">Or pick one of these sample Sheets to see how it works:</p><div class="kl-hits">'+SAMPLES.map(function(x,i){return '<button type="button" class="kl-hit" data-kls="'+i+'"><b>'+esc(x.name)+'</b><span>Sample Sheet, '+x.tabs.length+' tabs</span></button>'}).join("")+'</div>';
      $("kl-body").innerHTML=b;$("kl-act").innerHTML='<button type="button" class="btn text" data-kl="back">Back</button><span style="flex:1"></span><button type="button" class="btn text" data-kl="cancel">Cancel</button>';
      var qf=$("kl-q");if(qf)qf.focus();return;
    }
    if(s.step==="new"){
      var sp=s.spec||{name:"Class Roster",tabs:[]};
      $("kl-t").textContent="Create a New Sheet";
      var cols='<div class="kl-spec">'+sp.tabs.map(function(t,i){return '<div class="kl-tabspec"><div class="kl-tabhead"><b>Tab: '+esc(t.name)+'</b>'+(t.cols.length&&!live()?'<button type="button" class="btn tonal sm" data-klcopy="'+i+'">Copy the Headings</button>':'')+'</div>'+(t.cols.length?'<div class="kl-cols">'+t.cols.map(function(c){return '<span>'+esc(c)+'</span>'}).join("")+'</div>':'<span class="kl-help">No set headings. Name the tab and the tool fills it in.</span>')+'</div>'}).join("")+'</div>'+

  }

  function rows(){var p=prefs(),q=P.q.toLowerCase();return data().items.filter(function(i){return (P.grade?i.grade===P.grade:(!p.grades.length||p.grades.indexOf(i.grade)>=0))&&(P.subject?i.subject===P.subject:(!p.subjects.length||p.subjects.indexOf(i.subject)>=0))&&(P.el||i.t!=="e")&&(!q||(i.code+" "+i.text).toLowerCase().indexOf(q)>=0)})}
  function listHtml(){var R=rows(),cut=R.slice(0,150);return (cut.map(function(i){return '<label class="ks-row"><input type="checkbox" data-kspick="'+esc(i.code)+'"'+(P.sel.indexOf(i.code)>=0?" checked":"")+'><span><b>'+esc(i.code)+'</b> '+esc(i.text)+'</span></label>'}).join("")||'<p class="kl-help">No standards match. Change the grade, the subject, or the search.</p>')+(R.length>150?'<p class="kl-help">Showing the first 150 of '+R.length+'. Pick a grade or search to narrow the list.</p>':'')}

    }
    $("ks-list").innerHTML=listHtml();$("ks-n").textContent=P.sel.length+" picked";
  }
  $("ks-dlg").addEventListener("submit",function(e){

  });
  $("ks-dlg").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;

  });
  $("ks-dlg").addEventListener("change",function(e){
    var d=e.target.dataset,t=e.target;

    else if(d.kspick!==undefined){tog(P.sel,d.kspick);$("ks-n").textContent=P.sel.length+" picked"}
    else if(t.id==="ks-file"&&t.files&&t.files[0])loadFile(t.files[0]);

  return {setup:setup,pick:pick,mine:mine,summary:summary,parse:parse,PREFS:PK};
})();

     '<form class="quick" data-quick="todo" data-day="'+(TODAYKEY||"Week")+'"><input type="text" aria-label="Add a task for today" placeholder="Add a task for today"><button class="btn tonal" type="submit">Add</button></form></div>'+
   '<div class="card"><div class="ch"><h3>This week\'s focus</h3><button class="btn text small" type="button" data-act="go" data-id="focus">Edit</button></div><ul class="list">'+(S.focus.map(function(f){return '<li class="row"><span class="grow"><b>'+esc(f.subject)+':</b> '+esc(f.text)+'</span></li>'}).join("")||'<li class="empty">No focus set yet.</li>')+'</ul></div>'+
   '<div class="card"><div class="ch"><h3>Coming up</h3><button class="btn text small" type="button" data-act="add" data-coll="events">Add date</button></div><ul class="list">'+(up.map(function(e){return '<li class="row"><span aria-hidden="true">'+esc(e.sticker)+'</span><span class="grow"><b>'+nice(e.date)+'</b> '+esc(e.title)+'</span>'+editBtn("events",e.id,e.title)+'</li>'}).join("")||'<li class="empty">No upcoming dates.</li>')+'</ul></div>'+
   '<div class="card"><div class="ch"><h3>Quick links</h3><button class="btn text small" type="button" data-act="go" data-id="links">All links</button></div><ul class="list">'+(S.links.slice(0,5).map(function(l){return '<li class="row"><span class="grow"><a href="'+esc(href(l.url))+'" target="_blank" rel="noopener">'+esc(l.title)+'</a></span></li>'}).join("")||'<li class="empty">No links yet.</li>')+'</ul></div>'+
  '</div>'+
  '<div class="foot"><span>'+(storageOk?"Your changes save in this browser.":"This browser is not saving changes, so edits last until you close the page.")+'</span><button class="btn text small" type="button" data-act="reset">Restore sample data</button></div>';
}
function vLinks(){
  var cats=[];S.links.forEach(function(l){if(cats.indexOf(l.cat)<0)cats.push(l.cat)});
  return '<div class="head"><div><h1>Links</h1><p class="muted">Everything you open every day, in one place.</p></div>'+addBtn("links","Add link")+'</div>'+
  '<div class="grid g3">'+(cats.map(function(c){
    return '<div class="card"><h3>'+esc(c||"Other")+'</h3><ul class="list">'+S.links.filter(function(l){return l.cat===c}).map(function(l){
      return '<li class="row"><span class="grow"><a href="'+esc(href(l.url))+'" target="_blank" rel="noopener">'+esc(l.title)+'</a></span>'+editBtn("links",l.id,l.title)+'</li>';
    }).join("")+'</ul><button class="btn text small" type="button" data-act="add" data-coll="links" data-cat="'+esc(c)+'" style="align-self:flex-start">Add to this group</button></div>';
  }).join("")||'<p class="empty">No links yet. Add your first one.</p>')+'</div>';
}
function vFocus(){
  return '<div class="head"><div><h1>Weekly focus</h1><p class="muted">What the class is working on this week, by subject.</p></div>'+addBtn("focus","Add subject")+'</div>'+
  '<div class="grid g3">'+(S.focus.map(function(f){return '<div class="card"><div class="ch"><span class="tag">'+esc(f.subject)+'</span>'+editBtn("focus",f.id,f.subject)+'</div><p style="font-size:1.125rem">'+esc(f.text)+'</p></div>'}).join("")||'<p class="empty">No subjects yet.</p>')+'</div>';
}
function vTodos(){
  var done=S.todos.filter(function(t){return t.done}).length;
  return '<div class="head"><div><h1>To do</h1><p class="muted">'+done+' of '+S.todos.length+' done this week.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outlined" type="button" data-act="cleardone"'+(done?"":" disabled style=\"opacity:.4\"")+'>Clear finished</button>'+addBtn("todos","Add task")+'</div></div>'+
  '<div class="days">'+DAYS.map(function(d){
    return '<div class="card day'+(d===TODAYKEY?" today":"")+'"><div class="ch"><h3>'+DAYNAME[d]+'</h3>'+(d===TODAYKEY?'<span class="tag">Today</span>':'')+'</div><ul class="list">'+(S.todos.filter(function(t){return t.day===d}).map(todoRow).join("")||'<li class="empty">Nothing yet</li>')+'</ul><form class="quick" data-quick="todo" data-day="'+d+'" style="margin-top:auto"><input type="text" aria-label="Add a task for '+DAYNAME[d]+'" placeholder="Add a task"><button class="btn tonal small" type="submit" style="height:38px">Add</button></form></div>';
  }).join("")+'</div>';
}
function vCal(){
  var first=new Date(calY,calM,1),start=first.getDay(),n=new Date(calY,calM+1,0).getDate(),t=iso(new Date()),cells="";
  for(var i=0;i<start;i++)cells+='<div class="cell out"></div>';
  for(var d=1;d<=n;d++){
    var ds=calY+"-"+pad(calM+1)+"-"+pad(d);
    var evs=S.events.filter(function(e){return e.date===ds});
    cells+='<div class="cell'+(ds===t?" today":"")+'"><div class="dn"><span>'+d+'</span><button class="plus" type="button" data-act="add" data-coll="events" data-date="'+ds+'" aria-label="Add event on '+MONTHS[calM]+' '+d+'">+</button></div>'+evs.map(function(e){return '<button class="ev" type="button" data-act="edit" data-coll="events" data-id="'+e.id+'" title="'+esc(e.title)+'">'+esc(e.sticker)+' '+esc(e.title)+'</button>'}).join("")+'</div>';
  }
  return '<div class="head"><div><h1>'+MONTHS[calM]+' '+calY+'</h1><p class="muted">Select + on a day to add a date. Select an event to change or delete it.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outlined" type="button" data-act="calprev">Previous</button><button class="btn outlined" type="button" data-act="caltoday">Today</button><button class="btn outlined" type="button" data-act="calnext">Next</button>'+addBtn("events","Add date")+'</div></div>'+
  '<div class="cal">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(x){return '<div class="dow">'+x+'</div>'}).join("")+cells+'</div>';
}
function vMeet(){
  var ms=S.meetings.slice().sort(function(a,b){return a.date<b.date?1:-1});
  return '<div class="head"><div><h1>Meeting notes</h1><p class="muted">Notes and action items, newest first.</p></div>'+addBtn("meetings","Add meeting")+'</div>'+
  '<div class="grid g2">'+(ms.map(function(m){
    return '<div class="card"><div class="ch"><div><span class="tag">'+esc(m.type)+'</span> <span class="muted" style="font-size:.875rem">'+nice(m.date)+'</span></div>'+editBtn("meetings",m.id,m.title)+'</div><h3>'+esc(m.title)+'</h3><p style="white-space:pre-wrap">'+(esc(m.notes)||'<span class="muted">No notes yet.</span>')+'</p><b style="font-size:.875rem">Action items</b><ul class="list">'+(m.actions.map(function(a){
      return '<li class="row'+(a.done?" done":"")+'"><input type="checkbox" data-toggle="action" data-mid="'+m.id+'" data-id="'+a.id+'"'+(a.done?" checked":"")+' aria-label="Done: '+esc(a.text)+'"><span class="grow">'+esc(a.text)+'</span><button class="iconb" type="button" data-act="adel" data-mid="'+m.id+'" data-id="'+a.id+'" aria-label="Delete action '+esc(a.text)+'">'+ic("x")+'</button></li>';
    }).join("")||'<li class="empty">No action items.</li>')+'</ul><form class="quick" data-quick="action" data-mid="'+m.id+'"><input type="text" aria-label="Add an action item" placeholder="Add an action item"><button class="btn tonal" type="submit">Add</button></form></div>';
  }).join("")||'<p class="empty">No meetings yet.</p>')+'</div>';
}
function vIdeas(){
  return '<div class="head"><div><h1>Ideas</h1><p class="muted">Catch it before you forget it.</p></div>'+addBtn("ideas","Add idea")+'</div>'+
  '<form class="quick" data-quick="idea" style="max-width:560px"><input type="text" aria-label="Quick idea" placeholder="Type an idea and press Enter"><button class="btn tonal" type="submit">Save</button></form>'+
  '<div class="notes">'+(S.ideas.map(function(n){return '<div class="note" style="background:var(--note-'+esc(n.color)+')"><p>'+esc(n.text)+'</p><div style="display:flex;justify-content:flex-end">'+editBtn("ideas",n.id,"idea")+'</div></div>'}).join("")||'<p class="empty">No ideas saved yet.</p>')+'</div>';
}
function vData(){
  function ok(u){return /^https:\/\/docs\.google\.com\/spreadsheets\//.test(u)}
  return '<div class="head"><div><h1>Data sources</h1><p class="muted">This dashboard reads from and saves to Google Sheets. Link another Sheet whenever a new source comes along.</p></div>'+addBtn("sources","Link a Sheet")+'</div>'+
  '<div class="grid g2">'+(S.sources.map(function(s){return '<div class="card"><div class="ch"><span class="tag">'+esc(s.mode)+'</span>'+editBtn("sources",s.id,s.name)+'</div><h3>'+esc(s.name)+'</h3><p><b>Tabs:</b> '+esc(s.tabs)+'</p><p class="muted">'+esc(s.use)+'</p><p>'+(ok(s.url)?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600">Open Sheet</a>':s.url?'<span class="tag" style="background:var(--tertiary-container)">Check the link</span>':'<span class="muted">Sample, not linked</span>')+'</p></div>'}).join("")||'<p class="empty">No Sheets linked yet.</p>')+'</div>'+
  (function(){var refs=S.sources.filter(function(s){return /^Reference/.test(s.mode)&&ok(s.url)});return refs.length?'<div class="card"><h3>Formulas for your reference Sheets</h3><p class="muted">One formula for each tab you chose. Paste each one into cell A1 of a new tab in your main Sheet.</p>'+refs.map(function(s){return KLink.formulas(s).map(function(x){return '<p style="overflow-wrap:anywhere"><code>'+esc(x.f)+'</code></p>'}).join("")}).join("")+'</div>':''})()+
  (function(){var lb=KLink.last("My Classroom Hub");return '<div class="head" style="margin-top:24px"><div><h1>Back up and restore</h1><p class="muted">A backup is one file with everything on this dashboard and your linked Sheets.</p></div><span class="tag"'+(lb?'':' style="background:var(--tertiary-container)"')+'>'+(lb?"Last backup: "+esc(lb):"No backup yet")+'</span></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn filled" type="button" data-act="bkdown">Download a backup</button><button class="btn tonal" type="button" data-act="bkcopy">Copy backup as text</button><button class="btn outlined" type="button" data-act="bkrestore">Restore from a backup</button></div>'})()+
  '<div class="foot"><span>On this demo, links are saved in your browser only. The real tool keeps this list on a tab named Sources, and the Google Sheet is the database: use File, Make a copy, and File, Version history, as two more safety nets. Kit files 18 and 26 explain the setup.</span></div>';
}
var VIEWS={home:vHome,links:vLinks,focus:vFocus,todos:vTodos,cal:vCal,meet:vMeet,ideas:vIdeas,data:vData};
function draw(){drawNav();$("main").innerHTML=VIEWS[view]()}

/* ---------- dialog form ---------- */
var FORMS={
 links:{name:"link",fields:[{k:"title",l:"Title"},{k:"url",l:"Web address",ph:"classroom.google.com"},{k:"cat",l:"Group",ph:"Every day, Planning, Team"}]},
 focus:{name:"subject",fields:[{k:"subject",l:"Subject"},{k:"text",l:"This week we are working on",type:"textarea"}]},
 todos:{name:"task",fields:[{k:"text",l:"Task"},{k:"day",l:"Day",type:"select",options:DAYS,labels:DAYNAME}]},
 events:{name:"date",fields:[{k:"title",l:"Event"},{k:"date",l:"Date",type:"date"},{k:"sticker",l:"Sticker",type:"choice",options:STICKERS}]},
 meetings:{name:"meeting",fields:[{k:"title",l:"Meeting"},{k:"date",l:"Date",type:"date"},{k:"type",l:"Type",type:"select",options:MTYPES},{k:"notes",l:"Notes",type:"textarea"}]},
 ideas:{name:"idea",fields:[{k:"text",l:"Idea",type:"textarea"},{k:"color",l:"Note color",type:"choice",options:COLORS,color:true}]},
 me:{name:"my info",fields:[{k:"name",l:"Your name"},{k:"cls",l:"Class or role"}]},
 sources:{name:"data source",fields:[{k:"name",l:"Name of the Google Sheet"},{k:"url",l:"Link to the Sheet",ph:"https://docs.google.com/spreadsheets/d/..."},{k:"tabs",l:"Tabs to use"},{k:"use",l:"What it feeds"},{k:"mode",l:"How it is used",type:"select",options:["Reads and saves","Reference, read only"]}]}
};
var dlg=null,lastFocus=null;
function openForm(coll,id,defaults){
  var F=FORMS[coll],item=coll==="me"?S.me:(id?S[coll].filter(function(x){return x.id===id})[0]:defaults||{});
  if(!item)return;
  dlg={coll:coll,id:id,choice:{}};
  $("dlg-t").textContent=(coll==="me"?"Edit ":id?"Edit ":"Add ")+F.name;
  $("dlg-del").hidden=!id||coll==="me";
  $("dlg-f").innerHTML=F.fields.map(function(f){
    var v=item[f.k]==null?"":item[f.k],id2="f-"+f.k,inner;
    if(f.type==="textarea")inner='<textarea id="'+id2+'">'+esc(v)+'</textarea>';
    else if(f.type==="select")inner='<select id="'+id2+'">'+f.options.map(function(o){return '<option value="'+esc(o)+'"'+(o===v?" selected":"")+'>'+esc(f.labels?f.labels[o]:o)+'</option>'}).join("")+'</select>';
    else if(f.type==="choice"){
      dlg.choice[f.k]=v||f.options[0];
      return '<div class="field plain"><span id="'+id2+'-l">'+f.l+'</span><div class="choices" role="group" aria-labelledby="'+id2+'-l" data-choice="'+f.k+'">'+f.options.map(function(o){return '<button type="button" class="choice" data-v="'+esc(o)+'" aria-pressed="'+(o===dlg.choice[f.k])+'" aria-label="'+esc(o)+'"'+(f.color?' style="background:var(--note-'+o+')"':'')+'>'+(f.color?"":esc(o))+'</button>'}).join("")+'</div></div>';
    }
    else inner='<input id="'+id2+'" type="'+(f.type==="date"?"date":"text")+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
    return '<label class="field" for="'+id2+'"><span>'+f.l+'</span>'+inner+'</label>';
  }).join("");
  lastFocus=document.activeElement;
  $("scrim").hidden=false;
  var first=$("dlg-f").querySelector("input,textarea,select");if(first)first.focus();
}
function closeForm(){$("scrim").hidden=true;dlg=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
$("dlg-f").addEventListener("click",function(e){
  var b=e.target.closest(".choice");if(!b||!dlg)return;
  var g=b.parentNode;dlg.choice[g.dataset.choice]=b.dataset.v;
  Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",c===b)});
});
$("dlg").addEventListener("submit",function(e){
  e.preventDefault();if(!dlg)return;
  var F=FORMS[dlg.coll],vals={},firstKey=F.fields[0].k;
  F.fields.forEach(function(f){vals[f.k]=f.type==="choice"?dlg.choice[f.k]:$("f-"+f.k).value.trim()});
  if(!vals[firstKey]){$("f-"+firstKey).focus();return}
  if(dlg.coll==="events"&&!vals.date)vals.date=iso(new Date());
  if(dlg.coll==="meetings"&&!vals.date)vals.date=iso(new Date());
  if(dlg.coll==="links"&&!vals.cat)vals.cat="Other";
  if(dlg.coll==="me"){S.me=vals}
  else if(dlg.id){var it=S[dlg.coll].filter(function(x){return x.id===dlg.id})[0];for(var k in vals)it[k]=vals[k]}
  else{vals.id=uid();if(dlg.coll==="todos")vals.done=false;if(dlg.coll==="meetings")vals.actions=[];S[dlg.coll].push(vals)}
  save();closeForm();draw();
});
$("dlg-cancel").addEventListener("click",closeForm);
$("dlg-del").addEventListener("click",function(){
  if(!dlg||!dlg.id)return;var c=dlg.coll,id=dlg.id;
  remember("Deleted "+FORMS[c].name+".");
  S[c]=S[c].filter(function(x){return x.id!==id});save();closeForm();draw();
});
$("scrim").addEventListener("mousedown",function(e){if(e.target===$("scrim"))closeForm()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&dlg)closeForm()});

/* ---------- undo ---------- */
var undo=null,snackT=null;
function remember(msg){undo=JSON.stringify(S);$("snack-t").textContent=msg;$("snack").hidden=false;clearTimeout(snackT);snackT=setTimeout(function(){$("snack").hidden=true;undo=null},7000)}
$("snack-undo").addEventListener("click",function(){if(undo){S=JSON.parse(undo);undo=null;save();draw()}$("snack").hidden=true});

/* ---------- actions ---------- */
$("main").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,d=b.dataset;
  if(a==="go"){view=d.id;draw();window.scrollTo(0,0)}
  else if(a==="add"&&d.coll==="sources"){KLink.open({source:null,onSave:function(v){S.sources.push({id:uid(),name:v.name,url:v.url,tabs:v.tabs,allTabs:v.allTabs,use:v.use,mode:v.mode==="save"?"Reads and saves":"Reference, read only"});save();draw()}})}
  else if(a==="edit"&&d.coll==="sources"){var so=S.sources.filter(function(x){return x.id===d.id})[0];
    KLink.open({source:{name:so.name,url:so.url,tabs:so.tabs,allTabs:so.allTabs,use:so.use,mode:/^Reads/.test(so.mode)?"save":"ref"},onSave:function(v){so.name=v.name;so.url=v.url;so.tabs=v.tabs;so.allTabs=v.allTabs;so.use=v.use;so.mode=v.mode==="save"?"Reads and saves":"Reference, read only";save();draw()},
      onDelete:function(){remember("Data source removed.");S.sources=S.sources.filter(function(x){return x!==so});save();draw()}})}
  else if(a==="bkdown"){KLink.download("My Classroom Hub",[KEY],function(){draw()})}
  else if(a==="bkcopy"){try{navigator.clipboard.writeText(KLink.backupText("My Classroom Hub",[KEY]))}catch(err){}}
  else if(a==="bkrestore")KLink.restore("My Classroom Hub",[KEY]);
  else if(a==="add"){
    var def={};
    if(d.coll==="events"){def.date=d.date||iso(new Date());def.sticker=STICKERS[0]}
    if(d.coll==="todos")def.day=TODAYKEY||"Week";
    if(d.coll==="links")def.cat=d.cat||"";
    if(d.coll==="meetings"){def.date=iso(new Date());def.type=MTYPES[0]}
    if(d.coll==="ideas")def.color=COLORS[S.ideas.length%COLORS.length];
    openForm(d.coll,null,def);
  }
  else if(a==="edit")openForm(d.coll,d.id);
  else if(a==="me")openForm("me");
  else if(a==="adel"){var m=S.meetings.filter(function(x){return x.id===d.mid})[0];if(m){remember("Deleted action item.");m.actions=m.actions.filter(function(x){return x.id!==d.id});save();draw()}}
  else if(a==="cleardone"){remember("Cleared finished tasks.");S.todos=S.todos.filter(function(t){return !t.done});save();draw()}
  else if(a==="calprev"){calM--;if(calM<0){calM=11;calY--}draw()}
  else if(a==="calnext"){calM++;if(calM>11){calM=0;calY++}draw()}
  else if(a==="caltoday"){var n=new Date();calY=n.getFullYear();calM=n.getMonth();draw()}
  else if(a==="reset"){remember("Sample data restored.");S=sample();S.sources=defaultSources();save();draw()}
});
$("main").addEventListener("change",function(e){
  var t=e.target,d=t.dataset;
  if(d.toggle==="todos"){var it=S.todos.filter(function(x){return x.id===d.id})[0];if(it){it.done=t.checked;save();draw()}}
  if(d.toggle==="action"){var m=S.meetings.filter(function(x){return x.id===d.mid})[0];if(m){var a=m.actions.filter(function(x){return x.id===d.id})[0];if(a){a.done=t.checked;save();draw()}}}
});
$("main").addEventListener("submit",function(e){
  var f=e.target.closest("[data-quick]");if(!f)return;e.preventDefault();
  var v=f.querySelector("input").value.trim();if(!v)return;
  var q=f.dataset.quick,sel;
  if(q==="todo"){S.todos.push({id:uid(),text:v,day:f.dataset.day,done:false});sel='[data-quick="todo"][data-day="'+f.dataset.day+'"] input'}
  if(q==="action"){var m=S.meetings.filter(function(x){return x.id===f.dataset.mid})[0];if(m)m.actions.push({id:uid(),text:v,done:false});sel='[data-quick="action"][data-mid="'+f.dataset.mid+'"] input'}
  if(q==="idea"){S.ideas.unshift({id:uid(),text:v,color:COLORS[S.ideas.length%COLORS.length]});sel='[data-quick="idea"] input'}
  save();draw();var i=document.querySelector(sel);if(i)i.focus();
});
draw();
})();
</script>
<script>KLink.warn()</script>
</body>
</html>
